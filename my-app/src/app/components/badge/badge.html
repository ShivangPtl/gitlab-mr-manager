<span class="status-chip badge"
  [class.sm]="size === 'sm'"
  [class.md]="size === 'md'"
  [ngClass]="'status-' + resolvedColorGroup"
  [ngStyle]="{ color: 'var(--badge-color)', background: 'var(--badge-bg)', borderColor: 'var(--badge-border)' }">
  <mat-icon *ngIf="icon" inline>{{ icon }}</mat-icon>
  <span class="label">{{ label }}</span>
</span>
