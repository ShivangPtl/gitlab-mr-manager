<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-header">
    <div class="brand" *ngIf="!collapsed">
      <div class="brand-mark">◆</div>
      <div class="brand-text">
        <span class="brand-title">GitLab MR Manager</span>
        <span class="brand-subtitle">Team Utility</span>
      </div>
    </div>

    <div class="brand-mark collapsed-mark" *ngIf="collapsed">◆</div>

    <button
      type="button"
      class="collapse-btn"
      [class.collapsed-btn]="collapsed"
      (click)="toggleSidebar()"
      [attr.title]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <mat-icon>{{ collapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>
  </div>

  <nav class="sidebar-nav" aria-label="Main navigation">
    <div class="nav-section">
      <span class="section-label" *ngIf="!collapsed">Workspace</span>

      <button
        type="button"
        *ngFor="let tab of tabsVisible"
        class="nav-item"
        [class.active]="isActive(tab.route)"
        (click)="goTo(tab.route)"
        [attr.title]="collapsed ? tab.label : null">
        <mat-icon class="nav-icon">{{ tab.matIcon }}</mat-icon>
        <span class="nav-label" *ngIf="!collapsed">{{ tab.label }}</span>
      </button>
    </div>
  </nav>

  <div class="sidebar-footer">
    <div class="user-panel" [class.compact]="collapsed">
      <div class="user-avatar">
        <mat-icon>account_circle</mat-icon>
      </div>

      <div class="user-details" *ngIf="!collapsed">
        <span class="user-name" [title]="userName">{{ userName }}</span>
        <span class="user-role">{{ isAdmin ? 'Administrator' : 'User' }}</span>
      </div>

      <button
        type="button"
        class="logout-btn"
        (click)="logout()"
        [attr.title]="collapsed ? 'Sign out' : 'Sign out'">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </div>
</aside>
